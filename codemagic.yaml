
workflows:
  ios-prototype-unsigned:
    name: ONE Blackjack iOS prototype
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest

    scripts:
      - name: Create native iOS prototype files
        script: |
          mkdir -p OneBlackjack BroadcastExtension

          cat > project.yml <<'PROJECT'
          name: ONEBlackjack
          options:
            bundleIdPrefix: com.mustafasayin
            deploymentTarget:
              iOS: "16.0"
          settings:
            base:
              SWIFT_VERSION: "5.0"
              IPHONEOS_DEPLOYMENT_TARGET: "16.0"
          targets:
            ONEBlackjack:
              type: application
              platform: iOS
              sources:
                - path: OneBlackjack
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.mustafasayin.oneblackjack
                  PRODUCT_NAME: ONE Blackjack
                  INFOPLIST_KEY_CFBundleDisplayName: ONE Blackjack
                  TARGETED_DEVICE_FAMILY: "1"
              dependencies:
                - target: BroadcastExtension
                  embed: true
              scheme:
                gatherCoverageData: false
            BroadcastExtension:
              type: app-extension
              platform: iOS
              sources:
                - path: BroadcastExtension
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.mustafasayin.oneblackjack.BroadcastUpload
                  INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.broadcast-services-upload
                  INFOPLIST_KEY_NSExtension_NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).SampleHandler"
                  INFOPLIST_KEY_NSExtension_NSExtensionAttributes_RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
                  SKIP_INSTALL: YES
                  APPLICATION_EXTENSION_API_ONLY: YES
          PROJECT

          cat > OneBlackjack/ONEBlackjackApp.swift <<'SWIFT'
          import SwiftUI

          @main
          struct ONEBlackjackApp: App {
              var body: some Scene {
                  WindowGroup { ContentView() }
              }
          }
          SWIFT

          cat > OneBlackjack/ContentView.swift <<'SWIFT'
          import SwiftUI
          import WebKit
          import ReplayKit

          struct ContentView: View {
              var body: some View {
                  VStack(spacing: 14) {
                      Text("ONE Blackjack")
                          .font(.largeTitle.bold())

                      Text("Ekran yayını teknik prototipi")
                          .foregroundStyle(.secondary)

                      BroadcastPicker()
                          .frame(height: 54)

                      Text("Ekran yayınını iOS sistem penceresinden başlat.")
                          .font(.footnote)
                          .multilineTextAlignment(.center)

                      Divider()

                      Text("Mevcut web asistanı")
                          .font(.headline)

                      WebView(url: URL(string: "https://mustafasayn50.github.io/blackjack-asistani/?source=pwa")!)
                  }
                  .padding()
              }
          }

          struct BroadcastPicker: UIViewRepresentable {
              func makeUIView(context: Context) -> RPSystemBroadcastPickerView {
                  let picker = RPSystemBroadcastPickerView(frame: .zero)
                  picker.preferredExtension = "com.mustafasayin.oneblackjack.BroadcastUpload"
                  picker.showsMicrophoneButton = false
                  return picker
              }

              func updateUIView(_ uiView: RPSystemBroadcastPickerView, context: Context) {}
          }

          struct WebView: UIViewRepresentable {
              let url: URL

              func makeUIView(context: Context) -> WKWebView {
                  let view = WKWebView()
                  view.load(URLRequest(url: url))
                  return view
              }

              func updateUIView(_ uiView: WKWebView, context: Context) {}
          }
          SWIFT

          cat > BroadcastExtension/SampleHandler.swift <<'SWIFT'
          import ReplayKit
          import CoreMedia

          final class SampleHandler: RPBroadcastSampleHandler {
              private var videoFrameCount = 0

              override func broadcastStarted(withSetupInfo setupInfo: [String : NSObject]?) {
                  videoFrameCount = 0
                  NSLog("ONE Blackjack: broadcast started")
              }

              override func broadcastPaused() {
                  NSLog("ONE Blackjack: broadcast paused")
              }

              override func broadcastResumed() {
                  NSLog("ONE Blackjack: broadcast resumed")
              }

              override func broadcastFinished() {
                  NSLog("ONE Blackjack: broadcast finished; frames: %d", videoFrameCount)
              }

              override func processSampleBuffer(_ sampleBuffer: CMSampleBuffer, with sampleBufferType: RPSampleBufferType) {
                  guard sampleBufferType == .video else { return }
                  videoFrameCount += 1
              }
          }
          SWIFT

      - name: Install XcodeGen
        script: |
          brew install xcodegen
          xcodegen generate

      - name: Build iOS app with ad-hoc signing
        script: |
          xcodebuild \
            -project ONEBlackjack.xcodeproj \
            -scheme ONEBlackjack \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGN_IDENTITY=- \
            build

    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/Debug-iphoneos/*.app
